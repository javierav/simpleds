; SimpleDS — derivador de excedentes solares sobre ESP32-U.
; Documentación: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32u

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Firmware para el ESP32-WROOM-32U (antena externa U.FL).
[env:esp32u]
platform = platformio/espressif32 @ 6.9.0
board = esp32dev
framework = arduino
; Nivel de log del core: 0 nada, 1 error, 2 warn, 3 info, 4 debug, 5 verbose.
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *

; Tests unitarios de la lógica portable (lib/core) en el ordenador.
[env:native]
platform = native
test_framework = unity
