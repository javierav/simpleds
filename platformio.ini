; SimpleDS — solar surplus diverter on ESP32-U.
; Reference: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32u

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Firmware for the ESP32-WROOM-32U (external U.FL antenna).
[env:esp32u]
platform = platformio/espressif32 @ 6.9.0
board = esp32dev
framework = arduino
; Two 1.9 MB app slots (OTA) and a small SPIFFS; see ARCHITECTURE.md.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/embed_web_assets.py
; Core log level: 0 none, 1 error, 2 warn, 3 info, 4 debug, 5 verbose.
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra
lib_deps =
  paulstoffregen/OneWire @ 2.3.8
  milesburton/DallasTemperature @ 3.11.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *

; Host unit tests for the portable logic (lib/core).
[env:native]
platform = native
test_framework = unity
